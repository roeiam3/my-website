<svg class="dns-hierarchy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-label="DNS hierarchy for www.google.com: root refers to the .com TLD, the TLD refers to google.com nameservers, only the last hop returns the A record">
  <style>
    .dns-h-ink { fill: currentColor; }
    .dns-h-arrow { stroke: currentColor; fill: none; }
    .dns-h-tip { fill: currentColor; }
    .dns-h-box-label { fill: #1a2433; }
    .dns-h-box-sub { fill: #3d4a5c; }
  </style>
  <defs>
    <marker id="dns-h-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="dns-h-tip" d="M1 1L9 5L1 9z"/>
    </marker>
  </defs>

  <text class="dns-h-ink" x="340" y="26" text-anchor="middle" font-size="13">www.google.com. &#x2014; read right to left, each label owned one level down</text>

  <rect x="214" y="42" width="252" height="54" rx="8" fill="#d5d8de" stroke="#8b919c" stroke-width="0.5"/>
  <text class="dns-h-box-label" x="340" y="64" text-anchor="middle" font-size="14" font-weight="600">Root ( . )</text>
  <text class="dns-h-box-sub" x="340" y="82" text-anchor="middle" font-size="12">e.g. a.root-servers.net</text>

  <line class="dns-h-arrow" x1="340" y1="96" x2="340" y2="162" stroke-width="1" marker-end="url(#dns-h-tip)"/>
  <text class="dns-h-ink" x="200" y="123" text-anchor="end" font-size="12">
    <tspan x="200" dy="0">knows ~1,500 TLDs,</tspan>
    <tspan x="200" dy="15">nothing below them</tspan>
  </text>
  <text class="dns-h-ink" x="480" y="131" font-size="12">who handles .com?</text>

  <rect x="214" y="166" width="252" height="54" rx="8" fill="#ddd4ee" stroke="#7b6aa3" stroke-width="0.5"/>
  <text class="dns-h-box-label" x="340" y="188" text-anchor="middle" font-size="14" font-weight="600">TLD ( com )</text>
  <text class="dns-h-box-sub" x="340" y="206" text-anchor="middle" font-size="12">a&#x2013;m.gtld-servers.net</text>

  <line class="dns-h-arrow" x1="340" y1="220" x2="340" y2="286" stroke-width="1" marker-end="url(#dns-h-tip)"/>
  <text class="dns-h-ink" x="200" y="247" text-anchor="end" font-size="12">
    <tspan x="200" dy="0">knows .com delegations,</tspan>
    <tspan x="200" dy="15">not even if www exists</tspan>
  </text>
  <text class="dns-h-ink" x="480" y="255" font-size="12">who handles google.com?</text>

  <rect x="214" y="290" width="252" height="54" rx="8" fill="#ddd4ee" stroke="#7b6aa3" stroke-width="0.5"/>
  <text class="dns-h-box-label" x="340" y="312" text-anchor="middle" font-size="14" font-weight="600">Domain ( google.com )</text>
  <text class="dns-h-box-sub" x="340" y="330" text-anchor="middle" font-size="12">ns1&#x2013;ns4.google.com &#x2014; authoritative</text>

  <line class="dns-h-arrow" x1="340" y1="344" x2="340" y2="410" stroke-width="1" marker-end="url(#dns-h-tip)"/>
  <text class="dns-h-ink" x="200" y="371" text-anchor="end" font-size="12">
    <tspan x="200" dy="0">holds every record in</tspan>
    <tspan x="200" dy="15">the google.com zone</tspan>
  </text>
  <text class="dns-h-ink" x="480" y="379" font-size="12">what is www?</text>

  <rect x="214" y="414" width="252" height="54" rx="8" fill="#c5ebe0" stroke="#3d8a76" stroke-width="0.5"/>
  <text class="dns-h-box-label" x="340" y="436" text-anchor="middle" font-size="14" font-weight="600">Record ( www )</text>
  <text class="dns-h-box-sub" x="340" y="454" text-anchor="middle" font-size="12">www.google.com A 142.250.x.x</text>

  <rect class="dns-h-foot-bg" x="36" y="486" width="608" height="118" rx="8" fill="#e8eef6" stroke="#c5d2e4" stroke-width="0.5"/>
  <text class="dns-h-foot-title" x="340" y="518" text-anchor="middle" font-size="14" font-weight="600">Each level answers with a referral one step down &#x2014; never the final IP.</text>
  <text class="dns-h-foot-body" x="340" y="544" text-anchor="middle" font-size="12">
    <tspan x="340" dy="0">Ask root for www.google.com &#x2192; it matches the deepest thing it knows (com) and hands you that.</tspan>
    <tspan x="340" dy="18">Only the last hop returns actual data.</tspan>
  </text>
</svg>
